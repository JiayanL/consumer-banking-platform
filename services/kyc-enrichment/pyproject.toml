[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kyc-enrichment"
version = "0.1.0"
description = "KYC lookup and enrichment service (sanctions + PEP stubs)."
requires-python = ">=3.11"
authors = [{ name = "Identity Platform", email = "identity-platform@bofa.internal" }]
dependencies = [
    "fastapi>=0.110",
    "pydantic>=2.5",
    "uvicorn[standard]>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "coverage[toml]>=7.4",
    "pytest-cov>=4.1",
    "httpx>=0.26",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["kyc_enrichment"]
branch = true

[tool.coverage.report]
show_missing = true
