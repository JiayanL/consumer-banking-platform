server:
  port: 8080

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:h2:mem:authdb;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update

cbp:
  auth:
    secret: "dev-shared-secret-change-me-please-1234567890"
    access-token-ttl-minutes: 15
    refresh-token-ttl-minutes: 1440
  admin-seed:
    username: admin
    password: admin-seed-password
