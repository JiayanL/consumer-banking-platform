name: notification-service

on:
  push:
    branches: [main]
    paths:
      - 'services/notification-service/**'
      - 'libs/logging-sdk/**'
      - '.github/workflows/notification-service.yml'
  pull_request:
    paths:
      - 'services/notification-service/**'
      - 'libs/logging-sdk/**'
      - '.github/workflows/notification-service.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: services/notification-service/package-lock.json
      - name: Build logging-sdk
        working-directory: libs/logging-sdk
        run: npm install && npm run build
      - name: Install notification-service
        working-directory: services/notification-service
        run: npm install
      - name: Test notification-service
        working-directory: services/notification-service
        run: npm test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: istanbul-notification-service
          path: services/notification-service/coverage/coverage-summary.json
