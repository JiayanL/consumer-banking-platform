name: coverage-aggregation

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  aggregate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run all Java tests
        run: |
          mvn -f libs/common-auth/pom.xml -q install -DskipTests
          for s in account-service ledger-service auth-service wire-transfer-service transaction-processor audit-logger; do
            mvn -f services/$s/pom.xml -q test || true
          done

      - name: Run all TS tests
        run: |
          (cd libs/logging-sdk && npm install && npm run build)
          for s in notification-service customer-profile-api api-gateway session-manager; do
            (cd services/$s && npm install && npm test) || true
          done

      - name: Run all Python tests
        run: |
          pip install -e libs/pii-utils
          for s in kyc-enrichment reporting-aggregator pii-tokenization-service; do
            (cd services/$s && pip install -e ".[dev]" && pytest --cov --cov-report=xml) || true
          done

      - name: Aggregate
        run: |
          python tools/aggregate_coverage.py \
            --out tools/coverage-aggregate.json \
            --files-out tools/coverage-files.json

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-aggregate
          path: |
            tools/coverage-aggregate.json
            tools/coverage-files.json

      # Push the aggregate to coverage-dashboard. Skipped silently when the
      # repo doesn't have COVERAGE_DASHBOARD_URL configured (e.g. on forks).
      - name: Push to coverage-dashboard
        if: vars.COVERAGE_DASHBOARD_URL != ''
        env:
          COVERAGE_DASHBOARD_URL: ${{ vars.COVERAGE_DASHBOARD_URL }}
          COVERAGE_DASHBOARD_INGEST_TOKEN: ${{ secrets.COVERAGE_DASHBOARD_INGEST_TOKEN }}
        run: python tools/post_to_dashboard.py
