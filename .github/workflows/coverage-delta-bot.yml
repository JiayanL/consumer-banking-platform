name: coverage-delta-bot

on:
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  delta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Compute head coverage
        run: |
          mvn -pl libs/common-auth -am -q install -DskipTests || true
          for s in account-service ledger-service auth-service wire-transfer-service transaction-processor audit-logger; do
            mvn -pl services/$s -am -q test || true
          done
          (cd libs/logging-sdk && npm install && npm run build) || true
          for s in notification-service customer-profile-api api-gateway session-manager; do
            (cd services/$s && npm install && npm test) || true
          done
          pip install -e libs/pii-utils || true
          for s in kyc-enrichment reporting-aggregator; do
            (cd services/$s && pip install -e ".[dev]" && pytest --cov --cov-report=xml) || true
          done
          python tools/aggregate_coverage.py --out head.json

      - name: Compute base coverage
        run: |
          git fetch origin ${{ github.base_ref }}
          git checkout origin/${{ github.base_ref }}
          mvn -pl libs/common-auth -am -q install -DskipTests || true
          for s in account-service ledger-service auth-service wire-transfer-service transaction-processor audit-logger; do
            mvn -pl services/$s -am -q test || true
          done
          python tools/aggregate_coverage.py --out base.json || echo '{}' > base.json
          git checkout -

      - name: Post delta comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: python tools/coverage_delta_bot.py --base base.json --head head.json

      - name: Quality gate
        run: python tools/coverage_delta_bot.py --base base.json --head head.json --gate
