name: ledger-service

on:
  push:
    branches: [main]
    paths:
      - 'services/ledger-service/**'
      - '.github/workflows/ledger-service.yml'
  pull_request:
    paths:
      - 'services/ledger-service/**'
      - '.github/workflows/ledger-service.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build common-auth
        run: mvn -pl libs/common-auth -am -q install -DskipTests
      - name: Test ledger-service
        run: mvn -pl services/ledger-service -am -q test
      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-ledger-service
          path: services/ledger-service/target/site/jacoco/jacoco.xml
