name: audit-logger

on:
  push:
    branches: [main]
    paths:
      - 'services/audit-logger/**'
      - '.github/workflows/audit-logger.yml'
  pull_request:
    paths:
      - 'services/audit-logger/**'
      - '.github/workflows/audit-logger.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
      - name: Build common-auth
        run: mvn -pl libs/common-auth -am -q install -DskipTests
      - name: Test audit-logger
        run: mvn -pl services/audit-logger -am -q test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-audit-logger
          path: services/audit-logger/target/site/jacoco/jacoco.xml
